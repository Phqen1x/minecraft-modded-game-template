# ─────────────────────────────────────────────────────────────────────────────
# Pack configuration — Otherworld [Dungeons & Dragons] v8 HF2
# Minecraft 1.20.1 + Forge
# Full reference: https://github.com/Phqen1x/minecraft-server-snap/blob/main/docs/pack-yaml-reference.md
# ─────────────────────────────────────────────────────────────────────────────

name: "Otherworld [Dungeons & Dragons]"

version: "0.0.0-devel"

minecraft_version: "1.20.1"

mod_loader: forge

# Pin to the exact Forge build used by Otherworld v8 HF2, or use "latest"
mod_loader_version: "latest"

# Unused for Forge packs (Fabric installer only)
installer_version: "latest"

background_color: "#0a0618"

# Forge + 300+ mods needs plenty of heap
java_args: "-Xms4G -Xmx8G"

# ─── Mods ──────────────────────────────────────────────────────────────────
# side: both   → server AND client
# side: server → server artifact only
# side: client → client artifact only
#
# URLs marked "# TODO" need a direct CDN link before this pack will build.
# For CurseForge-only mods: https://mediafilez.forgecdn.net/files/{id//1000}/{id%1000}/{filename}
