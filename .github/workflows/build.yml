name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify required server files exist
        run: |
          for f in start.sh variables.txt eula.txt manifest.json; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done
          echo "All required server files present."

      - name: Check mod count
        run: |
          COUNT=$(ls mods/*.jar 2>/dev/null | wc -l)
          echo "Mod count: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No mods found in mods/"
            exit 1
          fi
